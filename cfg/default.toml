# Firecracker simulation configuration
# All parameters have defaults in the source; values here override those defaults.

[simulation]
steps_per_second     = 10     # physics ticks per second
blur_sigma           = 1.0    # Gaussian diffusion width per tick
diffusion_substeps   = 4      # substeps per tick for numerical stability

[wind]
advection_strength  = 0.2   # how far the temperature field is advected per substep
smooth_sigma        = 2.0   # Gaussian smoothing applied to the derived wind field
temporal_smoothing  = 0.1   # EMA weight toward newly computed wind (0 = frozen, 1 = instant)

[oxygen]
diffusion_sigma    = 3.0   # Gaussian diffusion width for oxygen transport
advection_strength = 3.0   # oxygen advection scale relative to wind

[noise]
# Default Perlin noise parameters (used for the fuel maps; terrain has its own).
scale       = 64.0
octaves     = 4
persistence = 0.5
lacunarity  = 2.0

[terrain]
# Octave Perlin noise for the elevation height map, normalised to [0, 1].
# More octaves layer in finer-resolution detail on top of the broad relief.
scale       = 96.0
octaves     = 6
persistence = 0.5
lacunarity  = 2.0
# Initial air temperature and oxygen fall off exponentially with elevation as
# exp(-rate * h): 1.0 at sea level (h=0), decaying toward the peaks (h=1).
temperature_lapse_rate = 3.0   # steeper -> colder peaks
oxygen_lapse_rate      = 1.5   # steeper -> thinner air at altitude

[relaxation]
# Newtonian relaxation pulls each cell toward its elevation equilibrium profile
# (the initial field): radiative forcing for temperature, fresh-air replenishment
# for oxygen. Replaces the old uniform atmospheric_cooling sink.
enabled               = true   # if false, skip the radiative sinks/sources (watch pure transport)
temperature_rate_low  = 0.02   # valleys: slow radiative cooling (heat-retaining blanket)
temperature_rate_high = 0.30   # peaks: fast heat escape (thin air, low thermal inertia)
oxygen_rate           = 0.05   # fresh-air replenishment rate; keep below peak burn draw

[convection]
# Single-layer mass/energy convection. Surface pressure is the column mass m; the
# column height H = terrain_height_scale*h + m*(1 + thermal_expansion*T). Mass and
# energy (E = m*T) flow together down the transport potential
# Phi = pressure_transport_rate*m + buoyancy_transport_rate*H, conserving both totals.
thermal_expansion       = 0.5   # alpha: how much temperature expands the column (raises H)
terrain_height_scale    = 0.5   # gamma: terrain's contribution to column-top height
buoyancy_transport_rate = 0.1   # c_b: mass/energy flux down the column-height gradient
pressure_transport_rate = 0.1   # c_p: mass/energy flux down the surface-pressure gradient

[fire]
enabled                     = true   # if false, combustion/radiant heat are skipped (watch convection only)
oxygen_consumption_rate     = 3.0    # oxygen consumed per unit of fuel burned (stoichiometric)
burnt_threshold             = 0.01   # fuel below this level is considered ash (no longer burns)
oxygen_extinction_threshold = 0.05   # oxygen below this level extinguishes fire
burn_heat_fuel_fraction     = 0.2    # fraction of burn heat deposited into fuel (rest goes to air)
spawn_fire                  = false  # if true, a random fire spawns at reset; if false, left-click to ignite
spawn_radius                = 5      # radius (in grid cells) of the circular ignition patch

# ---------------------------------------------------------------------------
# Fuel types — add more subtables here to expand to additional fuel types.
# Each subtable becomes one layer in the (N, H, W) fuel and fuel_temperatures arrays.
# ---------------------------------------------------------------------------

[fuel_types.grass]
heat_capacity          = 0.5    # thermal mass per unit of fuel
ignition_threshold     = 1.5    # fuel temperature required to ignite
consumption_rate       = 0.005  # fraction of fuel consumed per tick per unit fuel temperature
burn_heat_scale        = 100.0  # heat released per unit of fuel consumed
fuel_air_transfer_rate = 0.05   # rate of heat exchange with air
noise_scale            = 32.0   # spatial scale for Perlin noise initialisation
altitude_falloff       = 0.5    # vegetation thinning with elevation: (1-h)^falloff; gentle, grass persists at altitude
spawn_density          = 1.0    # scales the [0,1] noise into continuous grass density

[fuel_types.tree]
heat_capacity          = 2.5
ignition_threshold     = 1.5
consumption_rate       = 0.001
burn_heat_scale        = 300.0
fuel_air_transfer_rate = 0.01
noise_scale            = 32.0
altitude_falloff       = 3.0    # steep: trees thin out quickly with elevation
spawn_density          = 2.0    # mean trees per cell per unit elevation-thinned noise (exponential mean scale)
fuel_per_tree          = 1.0    # fuel mass contributed by each tree in a cell
max_trees_per_cell     = 4      # hard cap on the per-cell tree count

[radiant_heat]
# Radiation is conservative: a cell loses exactly the energy it emits (a T^exponent
# sink, like Stefan-Boltzmann), a fraction escapes to space, and the rest is spread to
# neighbours by the inverse-square kernel. The T^4 loss self-limits flame temperature.
kernel_radius      = 10      # max range of radiation in grid cells
emission_scale     = 1e-6    # multiplier on T^exponent emitted energy per tick
emission_exponent  = 4.0     # blackbody T^4; emission rises steeply with temperature
sky_escape_fraction = 0.2    # fraction of emitted energy lost upward to space (0..1)

[maps]
# Maps are fully-baked initial states loaded from disk. Generate them with
#     python src/gen_maps.py --count 8 --out maps
# reset() errors if no map is available, so generate at least one before running.
dir  = "maps"   # directory to load maps from
name = ""       # specific map filename to load; empty = pick a random map each reset

[environment]
grid_size          = 256      # simulation grid cells (N x N)
window_size        = 512      # display window size in pixels (square)
max_steps          = 10_000   # episode length before truncation
print_episode_info = true     # print variable state at the start and end of each episode
