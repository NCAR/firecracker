# Firecracker simulation configuration
# All parameters have defaults in the source; values here override those defaults.
#
# State is in SI units: temperature [K], mass [kg/m^2], terrain [m], oxygen [kg/m^3],
# fuel [kg/m^2], wind [m/s]. Fixed constants of nature and the reference atmosphere
# live in src/physics_constants.py.
#
# NOTE (units migration): map generation, I/O, and rendering are SI as of units_version 1.
# The dynamics constants under [convection], [relaxation], [fire], [radiant_heat], [wind]
# and [oxygen] are still the pre-SI values; they are redefined as the physical solvers
# land (Phases 2-5 of docs/units.md). Stepping is not yet physically meaningful.

[units]
# Physical discretisation. Each cell is cell_size_m on a side; the tick duration is
# 1/steps_per_second seconds (see [simulation]).
cell_size_m = 10.0

[simulation]
steps_per_second     = 10     # physics ticks per second
blur_sigma           = 1.0    # Gaussian diffusion width per tick

[wind]
smooth_sigma        = 2.0   # (pre-SI diagnostic wind) Gaussian smoothing; replaced by the Phase 2 solver
temporal_smoothing  = 0.1   # (pre-SI diagnostic wind) EMA weight; replaced by the Phase 2 solver
# Per-map synoptic (prevailing) wind: each generated map draws a random bearing and a
# speed [m/s] uniformly from this range. This is the steady background the momentum drag
# relaxes toward (Phase 2); terrain then channels/accelerates it.
# Prevailing baseline 5-15 m/s; terrain channeling/Venturi accelerates it locally toward
# the solver's ~30 m/s peak-wind calibration target (g'/C_d, CFL).
ambient_speed_min   = 5.0   # m/s
ambient_speed_max   = 15.0  # m/s

[oxygen]
diffusion_sigma    = 3.0   # Gaussian diffusion width for oxygen transport
advection_strength = 3.0   # oxygen advection scale relative to wind

[noise]
# Default Perlin noise parameters (used for the fuel maps; terrain has its own).
scale       = 64.0
octaves     = 4
persistence = 0.5
lacunarity  = 2.0

[terrain]
# Octave Perlin noise for the elevation height map, normalised to [0, 1] then scaled
# to metres by elev_max. More octaves layer finer detail on top of the broad relief.
scale       = 96.0
octaves     = 6
persistence = 0.5
lacunarity  = 2.0
elev_max    = 500.0     # peak elevation [m] (the normalised relief is scaled by this)
# Air temperature falls with elevation at the environmental lapse rate: T = T_REF - rate*z.
# Oxygen and column mass follow the hydrostatic profile (see physics_constants.py), so
# there is no separate oxygen falloff knob any more.
temperature_lapse_rate = 0.0065   # K/m (6.5 K per km)

[radiation]
# Surface radiative energy balance (see docs/units.md). Sunlight is absorbed at the surface
# (air is transparent to shortwave) and split between bare ground and fuel by a vegetation
# cover fraction c = 1 - exp(-total_fuel/cover_fuel_scale). Each surface body absorbs solar
# S_net and emits longwave eps*sigma*T^4 weighted by its area share; the air is warmed only by
# sensible exchange with the ground. S_net is fixed per-cell to S_net = eps*sigma*temp_eq^4, so
# radiative equilibrium sits at the rest profile temp_eq (= T_REF=303.15 K over flat ground,
# ~455 W/m^2). Heat capacity sets the speed: fine fuel (~1e3 J/m^2/K) heats fast, the ground
# skin (~1e5) follows, the deep air column (~1e6) lags far behind.
enabled              = true     # if false, skip the radiative balance (watch pure transport)
emissivity           = 0.95     # eps: grey-body emissivity of the surface
ground_heat_capacity = 1.0e5    # C_g [J/m^2/K]: thermal mass of the soil/litter surface skin
ground_air_exchange  = 10.0     # k_ga [W/m^2/K]: sensible heat transfer ground <-> air column
cover_fuel_scale     = 1.0      # kappa [kg/m^2]: fuel load at which canopy interception saturates

[relaxation]
# Fresh-air replenishment: relaxes oxygen toward its elevation equilibrium profile.
enabled     = true   # if false, skip oxygen replenishment
oxygen_rate = 0.05   # fresh-air replenishment rate; keep below peak burn draw

[convection]
# Single-layer mass/energy convection. Surface pressure is the column mass m; the
# column height H = terrain_height_scale*h + m*(1 + thermal_expansion*T). Mass and
# energy (E = m*T) flow together down the transport potential
# Phi = pressure_transport_rate*m + buoyancy_transport_rate*H, conserving both totals.
thermal_expansion       = 0.5   # alpha: how much temperature expands the column (raises H)
terrain_height_scale    = 0.5   # gamma: terrain's contribution to column-top height
buoyancy_transport_rate = 0.1   # c_b: mass/energy flux down the column-height gradient
pressure_transport_rate = 0.1   # c_p: mass/energy flux down the surface-pressure gradient

[momentum]
# Shallow boundary-layer orographic wind (see docs/units.md). The wind is prognostic
# [m/s], forced by the free-surface gradient -g'*grad(s), s = terrain + eta with the layer
# thickness eta = m*R_d*T/p_ref. Because the modelled layer is shallow (depth ~ layer_depth_ref,
# comparable to terrain) the air is squeezed over high terrain, so continuity speeds the wind
# up over crests and channels it through gaps. A boundary sponge injects the per-map synoptic
# wind at the upwind edge and absorbs outflow at the downwind edge (open domain); the interior
# feels only weak surface friction + viscosity, so terrain shapes the flow.
layer_depth_ref = 1000.0  # h_ref [m]: free-stream boundary-layer depth (sets the level lid)
reduced_gravity = 0.2     # g' [m/s^2]: free-surface forcing strength (gravity-wave speed sqrt(g'*eta))
drag_coeff      = 0.0005  # C_d [1/s]: weak interior surface friction (toward rest)
viscosity       = 50.0    # nu [m^2/s]: eddy viscosity (smoothing)
sponge_width    = 8       # cells: width of the boundary relaxation (open-domain inflow/outflow)
sponge_strength = 10.0    # [1/s]: peak edge relaxation rate toward (u_amb, rest mass)
cfl_target      = 0.5     # max Courant number per substep (advective + gravity-wave speed)
# Two-layer surface-wind core (Phase 6, leg a). Off keeps the single-slab model above. On
# splits the slab into a thin near-surface layer (the canyon/surface layer) under the upper
# layer, forced by the interface gradient -g'_s*grad(b_s) with a stronger surface drag. The
# rest split is derived at load (no on-disk change). Behaviour is unchanged while off.
two_layer               = false   # enable the two-layer surface-wind dynamics
surface_depth           = 200.0   # H_s [m]: surface-layer depth at the highest peak (its minimum)
reduced_gravity_surface = 0.2     # g'_s [m/s^2]: surface-layer interface forcing strength
surface_drag_coeff      = 0.002   # C_b [1/s]: surface-layer friction (stronger than the upper drag)

[fire]
# Surface-area-controlled, oxygen-limited combustion (see docs/units.md). Fuel reacts at its
# surface, so the burn rate is the reactive surface area (a_s = sigma/particle_density, from each
# fuel type) times a surface mass flux psi [kg/(m^2*s)] that puts chemistry and O2 transport in
# series: psi_kin = arrhenius_pre*exp(-activation_energy/(R*T_fuel)) (kinetic, the ignition gate --
# cold fuel inert as the exponential underflows) and psi_dif = surface_mass_transfer*(O2/O2_ref)
# (O2 film diffusion, the flame-hot cap). The flaming residence time tau ~ 1/(a_s*psi) emerges, so
# high-SAV grass burns out in seconds and a low-SAV log over minutes. Burned mass releases
# heat_of_combustion, split between fuel and air by burn_heat_fuel_fraction. The oxygen field is
# the near-surface combustion-layer density [kg/m^3]; the areal burn [kg/m^2] also draws from a
# combustion_mixing_depth-deep slab (a whole-cell inventory backstop) so a vigorous fire can
# locally deplete its O2 (resupplied by advection + the oxygen relaxation). The air share of the
# heat is injected into a shallow plume_mixing_depth slab (not the full column), so a burn raises a
# strong, advectable air-temperature signal that lifts eta and drives the convective indraft. A
# fraction of that air share (convective_fraction) is convected onto nearby fuel to ignite it -- the
# mechanism that propagates the front. Radiation (see [radiant_heat]) preheats the fuel ahead but is
# too weak to ignite it at realistic flame temps, so convection (hot plume gas / flame contact)
# carries ignition and the spread is convection-dominant (realistic for grass). It is deposited only
# into sub-flaming fuel (below flame_gate_temperature, so flaming fuel stays combustion-controlled and
# the front does not run away), over a short convective_radius_m reach skewed by a von Mises angular
# kernel exp(b.offset_hat) whose bias vector b blends the wind (convective_wind_bias -> lee bias)
# with the upslope terrain gradient (convective_slope_bias -> Rothermel slope effect, scaling as
# tan^2(slope) so the front spreads faster uphill on steeper ground). |b| is the forward
# concentration (no cap), so wind and slope aligning keeps focusing the deposit into a tighter head.
enabled                  = true   # if false, combustion/radiant heat are skipped (watch convection only)
burnt_threshold          = 0.01   # fuel below this level [kg/m^2] is considered ash (no longer burns)
burn_heat_fuel_fraction  = 0.05   # fraction of burn heat deposited into fuel (sets flame temp; rest -> air)
combustion_mixing_depth  = 30.0   # d_mix [m]: depth of the near-surface layer the fire draws O2 from
surface_mass_transfer    = 0.02   # h [kg/(m^2*s)]: O2 film-transport flux to a fuel surface (the hot-burn cap)
plume_mixing_depth       = 100.0  # d_plume [m]: shallow plume the air-share burn heat is injected into
convective_fraction      = 0.12   # share of the air-share heat convected to nearby fuel (spread driver)
flame_gate_temperature   = 700.0  # K: convection ignites only fuel below this (flaming fuel is combustion-set)
convective_radius_m      = 10.0   # reach [m] of the convective ignition onto neighbouring fuel
convective_wind_bias     = 1.0    # downwind skew of the convective ignition (concentration on the unit wind)
convective_slope_bias    = 2.5    # upslope skew of the convective ignition (concentration on tan^2(slope))
spawn_fire               = false  # if true, a random fire spawns at reset; if false, left-click to ignite
spawn_radius             = 5      # radius (in grid cells) of the circular ignition patch

# ---------------------------------------------------------------------------
# Fuel types — add more subtables here to expand to additional fuel types.
# Each subtable becomes one layer in the (N, H, W) fuel and fuel_temperatures arrays.
# ---------------------------------------------------------------------------

[fuel_types.grass]
specific_heat          = 1800.0  # SI specific heat [J/(kg*K)] (dry grass): radiation, conduction, combustion
ignition_threshold     = 573.0   # pyrolysis onset temperature [K] (~300 C); used by the radiant-heat mask
heat_of_combustion     = 1.6e7   # HHV [J/kg] released per kg of fuel burned
stoich_oxygen          = 1.4     # s [kg O2 / kg fuel]: stoichiometric oxygen demand
arrhenius_pre          = 1.0e8   # B [kg/(m^2*s)]: surface kinetic-flux pre-exponential
activation_energy      = 1.0e5   # E_a [J/mol]: Arrhenius activation energy
surface_area_to_volume = 12000.0 # sigma [1/m]: surface-area-to-volume ratio (fine grass -> fast burn)
particle_density       = 500.0   # rho_p [kg/m^3]: solid material density (a_s = sigma/rho_p)
fuel_air_transfer_rate = 12.0    # k [W/(m^2*K)]: fuel<->air convective conductance
noise_scale            = 32.0   # spatial scale for Perlin noise initialisation
altitude_falloff       = 0.5    # vegetation thinning with elevation: (1-h)^falloff; gentle, grass persists at altitude
spawn_density          = 1.5    # peak grass loading [kg/m^2] (scales the [0,1] noise)

[fuel_types.tree]
specific_heat          = 2300.0  # SI specific heat [J/(kg*K)] (wood)
ignition_threshold     = 600.0   # pyrolysis onset temperature [K]
heat_of_combustion     = 1.8e7   # HHV [J/kg]
stoich_oxygen          = 1.4     # s [kg O2 / kg fuel]
arrhenius_pre          = 5.0e7   # B [kg/(m^2*s)]: surface kinetic-flux pre-exponential
activation_energy      = 1.1e5   # E_a [J/mol]: higher than grass -> ignites less readily
surface_area_to_volume = 40.0    # sigma [1/m]: coarse wood (~10 cm) -> low surface area -> slow burn
particle_density       = 500.0   # rho_p [kg/m^3]: solid material density (a_s = sigma/rho_p)
fuel_air_transfer_rate = 8.0     # k [W/(m^2*K)]
noise_scale            = 32.0
altitude_falloff       = 3.0    # steep: trees thin out quickly with elevation
spawn_density          = 2.0    # mean trees per cell per unit elevation-thinned noise (exponential mean scale)
fuel_per_tree          = 5.0    # fuel loading contributed by each tree [kg/m^2] (up to 4 trees -> 20 kg/m^2)
max_trees_per_cell     = 4      # hard cap on the per-cell tree count

[radiant_heat]
# Flame radiant transfer: the fire-spread mechanism. The fuel's grey-body longwave
# eps*sigma*T^4 is emitted (and the emitter cooled) by [radiation]; this stage only
# *redistributes* the super-ambient part eps*sigma*(T^4 - temp_eq^4) onto nearby fuel by
# the inverse-square kernel, so a flame's heat ignites its neighbours. Uses [radiation].emissivity
# and the real Stefan-Boltzmann sigma; the T^4 sink (in [radiation]) self-limits flame temperature.
enabled             = true   # redistribute flame radiant heat to neighbours (off = convection-only spread)
kernel_radius_m     = 100.0  # radiative reach of a flame [m] (converted to cells by cell_size_m)
sky_escape_fraction = 0.2    # fraction of the redistributed emission lost upward to space (0..1)

[maps]
# Maps are fully-baked initial states loaded from disk. Generate them with
#     python src/gen_maps.py --count 8 --out maps
# reset() errors if no map is available, so generate at least one before running.
dir  = "maps"   # directory to load maps from
name = ""       # specific map filename to load; empty = pick a random map each reset

[rollout]
# Batched rollout collector (src/rollout.py) for world-model training. One Simulation
# steps num_envs worlds in parallel; each tick's B x C x N x N observation is pooled, and
# the trainer draws random near-I.I.D. minibatches from the pool.
#
# Consecutive ticks barely differ, so only every stride-th frame is stored, keeping the pool
# small and decorrelated.
#
# Pool memory = (steps // stride) * num_envs * C * N * N * bytes(buffer_dtype). With the
# defaults below at N=256, C=3: (1024//16) * 64 * 3 * 256*256 * 4 B ~= 3.2 GB. The pool
# defaults to the CPU; shrink steps/num_envs, raise stride, or set buffer_dtype = "float16"
# (halves it) to fit your hardware; stepping always runs on the simulation device.
num_envs       = 64        # B: worlds stepped in parallel (sampled with replacement from the maps dir)
steps          = 1024      # ticks stepped per collect()
stride         = 16        # store every stride-th frame; pool holds (steps // stride) * num_envs samples
minibatch_size = 256       # samples per sample_minibatch() draw
buffer_device  = "cpu"     # where the sample pool lives ("cpu" or "cuda")
buffer_dtype   = "float32" # pool storage dtype ("float32" or "float16")

[environment]
# device selects where the simulation tensors live: "cuda" for an NVIDIA GPU,
# "cpu" to force the CPU. Omit (or leave commented) to auto-select cuda when
# available, else cpu — the same code path runs on both.
# device           = "cuda"
grid_size          = 256      # simulation grid cells (N x N)
window_size        = 512      # display window size in pixels (square)
max_steps          = 10_000   # episode length before truncation
print_episode_info = true     # print variable state at the start and end of each episode
