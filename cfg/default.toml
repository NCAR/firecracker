# Firecracker simulation configuration
# All parameters have defaults in the source; values here override those defaults.
#
# State is in SI units: temperature [K], mass [kg/m^2], terrain [m], oxygen [kg/m^3],
# fuel [kg/m^2], wind [m/s]. Fixed constants of nature and the reference atmosphere
# live in src/physics_constants.py.
#
# The model is fully SI: every stage of the step (boundary-layer wind, radiation, combustion,
# radiant transfer, terrain channeling) runs in physical units (docs/units.md, phases 0-6).

[units]
# Physical discretisation. Each cell is cell_size_m on a side; seconds_per_tick is how much
# physical time one tick advances (the physics dt), decoupled from the display tick-rate below.
cell_size_m = 10.0
# seconds_per_tick = 0.1   # physics dt [s]; omit to default to 1/steps_per_second (= 0.1 s).
# Raise it to simulate more physics per tick (faster than real time) at some loss of temporal
# resolution: e.g. 1.0 -> 10x real time at steps_per_second = 10. The wind core CFL-substeps and
# combustion/heat-exchange are exact-exponential, so a large dt stays stable (re-validate spread
# behavior if you change it -- the spread scenarios are calibrated at dt = 0.1 s).

[simulation]
steps_per_second     = 10     # real-time DISPLAY throttle [Hz]: ticks rendered per wall-second.
                              # The physics dt is [units].seconds_per_tick, not this.

[wind]
# Per-map synoptic (prevailing) wind: each generated map draws a random bearing and a
# speed [m/s] uniformly from this range. This is the steady background the momentum drag
# relaxes toward (Phase 2); terrain then channels/accelerates it.
# Prevailing baseline 5-15 m/s; terrain channeling/Venturi accelerates it locally toward
# the solver's ~30 m/s peak-wind calibration target (g'/C_d, CFL).
ambient_speed_min   = 5.0   # m/s
ambient_speed_max   = 15.0  # m/s

[oxygen]
diffusion_sigma    = 3.0   # Gaussian diffusion width for oxygen transport
advection_strength = 3.0   # oxygen advection scale relative to wind

[noise]
# Default Perlin noise parameters (used for the fuel maps; terrain has its own).
scale       = 64.0
octaves     = 4
persistence = 0.5
lacunarity  = 2.0

[terrain]
# Octave Perlin noise for the elevation height map, normalised to [0, 1] then scaled
# to metres by elev_max. More octaves layer finer detail on top of the broad relief.
scale       = 96.0
octaves     = 6
persistence = 0.5
lacunarity  = 2.0
exponent    = 1.0       # power applied to the normalised relief: >1 flattens lowlands and sharpens peaks; 1 = raw noise
elev_max    = 500.0     # peak elevation [m] (the normalised relief is scaled by this)
# Air temperature falls with elevation at the environmental lapse rate: T = T_REF - rate*z.
# Oxygen and column mass follow the hydrostatic profile (see physics_constants.py), so
# there is no separate oxygen falloff knob any more.
temperature_lapse_rate = 0.0065   # K/m (6.5 K per km)

[sunlight]
# Static per-cell solar exposure baked at map-generation time: how much sunlight each cell
# receives on average, relative to a flat, fully-exposed surface (dimensionless, [0, 1]). It
# folds in the two dominant terrain effects -- slope/aspect (in the northern hemisphere the
# south-facing sides of mountains catch far more sun than north-facing ones) and cast shadow
# (deep valleys and pole-facing hollows lose their direct beam to the surrounding terrain). The
# sun is sampled along the clear-sky daily arc (hour angle) over a few seasons (declination) at
# the configured latitude; each sample's beam is gated by a horizon ray-march for the shadowing.
latitude_deg        = 40.0   # site latitude [deg]; positive = northern hemisphere (sun in the southern sky)
axial_tilt_deg      = 23.44  # obliquity [deg]: seasonal declination is sampled over +/- this
num_seasons         = 1      # declination samples (1 = equinox only; >1 spreads over +/- axial_tilt)
num_hours           = 12     # hour-angle samples across the day (more = smoother daily integral)
hour_half_angle_deg = 90.0   # half-arc sampled each side of solar noon (90 = sunrise to sunset)
shadows             = true   # ray-march the terrain horizon for cast shadows (false = slope/aspect only)
max_shadow_steps    = 0      # cap on the per-sample shadow march in cells (0 = grid size)
diffuse_fraction    = 0.15   # isotropic skylight floor: a fully shaded cell still gets this fraction
# Sunlight is baked into the per-cell surface (rest) temperature at generation: the elevation
# profile warmed on sun-facing slopes and cooled in shadow. temp_moderation sets how strongly the
# atmosphere damps the bare radiative swing: 0 = pure (vacuum) radiative response (shade gets very
# cold), 1 = no solar effect. Earth's air insulation + lateral mixing keep shade only "a bit cool".
temp_moderation     = 0.85

[radiation]
# Surface radiative energy balance (see docs/units.md). Sunlight is absorbed at the surface
# (air is transparent to shortwave) and split between bare ground and fuel by a vegetation
# cover fraction c = 1 - exp(-total_fuel/cover_fuel_scale). Each surface body absorbs solar
# S_net and emits longwave eps*sigma*T^4 weighted by its area share; the air is warmed only by
# sensible exchange with the ground. S_net is fixed per-cell to S_net = eps*sigma*temp_eq^4, so
# radiative equilibrium sits at the rest profile temp_eq (= T_REF=303.15 K over flat ground,
# ~455 W/m^2). Heat capacity sets the speed: fine fuel (~1e3 J/m^2/K) heats fast, the ground
# skin (~1e5) follows, the deep air column (~1e6) lags far behind.
enabled              = true     # if false, skip the radiative balance (watch pure transport)
emissivity           = 0.95     # eps: grey-body emissivity of the surface
ground_heat_capacity = 1.0e5    # C_g [J/m^2/K]: thermal mass of the soil/litter surface skin
ground_air_exchange  = 10.0     # k_ga [W/m^2/K]: sensible heat transfer ground <-> air column
cover_fuel_scale     = 1.0      # kappa [kg/m^2]: fuel load at which canopy interception saturates

[relaxation]
# Fresh-air replenishment: relaxes oxygen toward its elevation equilibrium profile.
enabled     = true   # if false, skip oxygen replenishment
oxygen_rate = 0.05   # fresh-air replenishment rate; keep below peak burn draw

[venting]
# Plume vertical venting -- the air-temperature sink (see docs/units.md). The combustion air-share
# heat is injected into the shallow plume slab ([fire].plume_mixing_depth), but the air field is
# radiatively transparent and otherwise loses heat only by weak ground exchange and horizontal
# advection, so over a large or sustained fire that heat accumulates without bound and conducts back
# into the fuel -- a temperature runaway. A real plume rises buoyantly and carries the heat up and
# out of the modelled slab while fresh air entrains; this relaxes the super-ambient air toward the
# rest profile at rate lambda ~ updraft / plume depth (the inverse plume-residence time). It is
# one-directional (a heat sink only -- never warms air below the rest profile), so a quiescent world
# is unaffected and the closed conservation core is recovered with enabled = false.
enabled = true    # if false, the plume air-share heat has no vertical sink (pre-fix runaway behavior)
rate    = 0.2     # lambda [1/s]: venting rate (~ updraft / plume depth). Raised from 0.05 once trees
                  # actually burn (Phase 6b): a fully-involved dense tree cell (~20 kg/m^2) releases far
                  # more heat than the old rate could shed, so the air ran away (~40000 K) in 3-4 tree
                  # cells; 0.2 bounds the plume to a physical ~2200 K flame. Real intense fires drive
                  # stronger updrafts, so a higher sink for higher intensity is physically consistent.

[momentum]
# Shallow boundary-layer orographic wind (see docs/units.md). The wind is prognostic
# [m/s], forced by the free-surface gradient -g'*grad(s), s = terrain + eta with the layer
# thickness eta = m*R_d*T/p_ref. Because the modelled layer is shallow (depth ~ layer_depth_ref,
# comparable to terrain) the air is squeezed over high terrain, so continuity speeds the wind
# up over crests and channels it through gaps. A boundary sponge injects the per-map synoptic
# wind at the upwind edge and absorbs outflow at the downwind edge (open domain); the interior
# feels only weak surface friction + viscosity, so terrain shapes the flow.
layer_depth_ref = 1000.0  # h_ref [m]: free-stream boundary-layer depth (sets the level lid)
spinup_steps    = 800     # gen_maps: solver ticks to develop the orographic wind before baking it
                          # into each map (0 = ship the level-lid rest state with uniform wind)
reduced_gravity = 0.2     # g' [m/s^2]: free-surface forcing strength (gravity-wave speed sqrt(g'*eta))
drag_coeff      = 0.0005  # C_d [1/s]: weak interior surface friction (toward rest)
viscosity       = 50.0    # nu [m^2/s]: eddy viscosity (smoothing)
sponge_width    = 8       # cells: width of the boundary relaxation (open-domain inflow/outflow).
                          # Doubles as the observation padding: the physics grid is the observed
                          # [environment].grid_size padded by sponge_width on every side (so the
                          # sponge ring sits entirely outside the observed/rendered interior, which
                          # stays sponge-free). Maps are generated at that padded size. An explicit
                          # [environment].padding overrides this (e.g. 0 to disable padding).
sponge_strength = 10.0    # [1/s]: peak edge relaxation rate toward (u_amb, rest mass)
cfl_target      = 0.5     # max Courant number per substep (advective + gravity-wave speed)

[channeling]
# Diagnostic terrain-channeling surface wind (Phase 6, Option 2; see docs/units.md). The prognostic
# momentum core makes valleys *slow* (its level-lid layer deepens in low ground), so it cannot
# produce gap/Venturi speedups. Instead of a second prognostic layer, a static per-map gain speeds
# up -- direction unchanged -- the near-surface wind the fire and oxygen read. For each cell the
# cross-stream relief (perpendicular to the synoptic wind) is scanned out to radius_m each way; each
# step's openness = clamp(1 - rise/height_scale_m, 0, 1) is shadowed (running min) and summed into an
# open width per side, the wider (more-open) side is kept, and gain = clamp(radius/open_width, 1,
# gain_max). So a valley confined both ways gets a big gain while a hillside or mountain base (open on
# one side) stays ~1; taller and closer walls both raise the gain continuously (no hard threshold).
# The prognostic field is untouched, so the gap-wind xfail (which reads the prognostic field) stays.
enabled        = true    # apply the channeling gain to the wind the fire/oxygen read (false = prognostic wind)
radius_m       = 300.0   # cross-stream scan reach [m] each way (sets the gap scale the gain responds to)
height_scale_m = 100.0   # terrain rise [m] that fully closes the channel (a smaller rise closes it partly)
gain_max       = 2.0     # cap on the channeling speedup (a tight gap saturates here); stacks on the prognostic lee/foehn overshoot (~1.3x), so 3.0 drove ~45 m/s fire winds from a 15 m/s synoptic
smooth_sigma   = 1.0     # Gaussian smoothing [cells] of the gain field (removes per-cell speckle)

[fire]
# Surface-area-controlled, oxygen-limited combustion (see docs/units.md). Fuel reacts at its
# surface, so the burn rate is the reactive surface area (a_s = sigma/particle_density, from each
# fuel type) times a surface mass flux psi [kg/(m^2*s)] that puts chemistry and O2 transport in
# series: psi_kin = arrhenius_pre*exp(-activation_energy/(R*T_fuel)) (kinetic, the ignition gate --
# cold fuel inert as the exponential underflows) and psi_dif = surface_mass_transfer*(O2/O2_ref)
# (O2 film diffusion, the flame-hot cap). The flaming residence time tau ~ 1/(a_s*psi) emerges, so
# high-SAV grass burns out in seconds and a low-SAV log over minutes. Burned mass releases
# heat_of_combustion, split between fuel and air by burn_heat_fuel_fraction. The oxygen field is
# the near-surface combustion-layer density [kg/m^3]; the areal burn [kg/m^2] also draws from a
# combustion_mixing_depth-deep slab (a whole-cell inventory backstop) so a vigorous fire can
# locally deplete its O2 (resupplied by advection + the oxygen relaxation). The air share of the
# heat is injected into a shallow plume_mixing_depth slab (not the full column), so a burn raises a
# strong, advectable air-temperature signal that lifts eta and drives the convective indraft. A
# fraction of that air share (convective_fraction) is convected onto nearby fuel to ignite it -- the
# mechanism that propagates the front. Radiation (see [radiant_heat]) preheats the fuel ahead but is
# too weak to ignite it at realistic flame temps, so convection (hot plume gas / flame contact)
# carries ignition and the spread is convection-dominant (realistic for grass). It is deposited only
# into sub-flaming fuel (below flame_gate_temperature, so flaming fuel stays combustion-controlled and
# the front does not run away), over a short convective_radius_m reach skewed by a von Mises angular
# kernel exp(b.offset_hat) whose bias vector b blends the wind (convective_wind_bias -> lee bias)
# with the upslope terrain gradient (convective_slope_bias -> Rothermel slope effect, scaling as
# tan^2(slope) so the front spreads faster uphill on steeper ground). |b| is the forward
# concentration (no cap), so wind and slope aligning keeps focusing the deposit into a tighter head.
enabled                  = true   # if false, combustion/radiant heat are skipped (watch convection only)
burnt_threshold          = 0.01   # fuel below this level [kg/m^2] is considered ash (no longer burns)
burn_heat_fuel_fraction  = 0.05   # fraction of burn heat deposited into fuel (sets flame temp; rest -> air)
combustion_mixing_depth  = 30.0   # d_mix [m]: depth of the near-surface layer the fire draws O2 from
surface_mass_transfer    = 0.02   # h [kg/(m^2*s)]: O2 film-transport flux to a fuel surface (the hot-burn cap)
plume_mixing_depth       = 100.0  # d_plume [m]: shallow plume the air-share burn heat is injected into
convective_fraction      = 0.24   # share of the air-share heat convected to nearby fuel (spread driver)
flame_gate_temperature   = 700.0  # K: convection ignites only fuel below this (flaming fuel is combustion-set)
convective_radius_m      = 10.0   # reach [m] of the convective ignition onto neighbouring fuel
convective_wind_bias     = 1.0    # downwind skew of the convective ignition (concentration on wind/u_ref)
convective_wind_ref      = 10.0   # u_ref [m/s]: wind speed at which the wind bias matches the old unit form
convective_slope_bias    = 2.5    # upslope skew of the convective ignition (concentration on tan^2(slope))
spawn_fire               = false  # if true, a random fire spawns at reset; if false, left-click to ignite
spawn_radius             = 5      # radius (in grid cells) of the circular ignition patch

[biomes]
# Non-overlapping vegetation biomes. Every cell is labelled exactly one biome from its elevation
# and baked surface temperature; within a biome the vegetation density is set purely by a Perlin
# noise map (elevation/slope/temperature do not shape it). That label decides which fuels grow there
# (grass on the grassland and, more thinly, the woodland; shrub only on the shrubland; trees in
# every biome at a per-biome density):
#   * woodland  -- cool cells (surface temperature <= woodland_temp_max), any slope: dense tree
#                  canopy over some grass (less than the open grassland), no shrub. Cool ground is
#                  the high tops and shaded hollows, so the woodland fills them regardless of slope.
#   * grassland -- warm, low ground (elevation <= grass_elev_max): lots of grass, no shrub, a few
#                  trees sprinkled around.
#   * shrubland -- warm ground above the grassland band (higher, but warm rather than cool, so not
#                  high enough to be woodland): shrub, no grass, a modest scatter of trees.
# Defaults give a roughly even split of the three biomes on the default terrain (~30/40/30). Raise
# woodland_temp_max for more woodland (a warmer cut steals cells from shrub/grass); raise
# grass_elev_max to push the grassland/shrubland boundary uphill (more grassland).
woodland_temp_max        = 298.0  # K: cells at/below this baked surface temperature are woodland (cool)
grass_elev_max           = 250.0  # m: warm cells at/below this elevation are grassland (else shrubland)
woodland_grass_fraction  = 0.6    # grass loading under the woodland canopy as a fraction of the grassland's (0 = none, 1 = as much as the open grassland)
# Border softness: the vegetation blends over a transition band around each biome threshold (rather
# than switching abruptly), so grass/shrub/trees cross-fade at the borders. Wider = gentler blend;
# 0 = hard edge (the discrete biome map is always hard -- this only softens the vegetation).
woodland_temp_softness   = 1.5    # K: width of the temperature blend band at the woodland edge
grass_elev_softness      = 35.0   # m: width of the elevation blend band at the grassland/shrubland edge
# Per-biome tree density = the exponential mean per-cell tree count fed to the stochastic tree
# sampler (count = floor(Exp(mean)*noise) capped at max_trees_per_cell). Higher -> more/denser trees.
tree_density_woodland    = 8.0    # dense canopy (well above the cap -> most cells full)
tree_density_grassland   = 0.6    # a sparse sprinkle of trees over the grass
tree_density_shrubland   = 1.2    # a modest scatter of trees -- more than the grassland, well short of the woodland's closed canopy

# ---------------------------------------------------------------------------
# Fuel types — add more subtables here to expand to additional fuel types.
# Each subtable becomes one layer in the (N, H, W) fuel and fuel_temperatures arrays.
# ---------------------------------------------------------------------------

[fuel_types.grass]
specific_heat          = 1800.0  # SI specific heat [J/(kg*K)] (dry grass): radiation, conduction, combustion
ignition_threshold     = 573.0   # pyrolysis onset temperature [K] (~300 C); used by the radiant-heat mask
heat_of_combustion     = 1.6e7   # HHV [J/kg] released per kg of fuel burned
stoich_oxygen          = 1.4     # s [kg O2 / kg fuel]: stoichiometric oxygen demand
arrhenius_pre          = 1.0e8   # B [kg/(m^2*s)]: surface kinetic-flux pre-exponential
activation_energy      = 1.0e5   # E_a [J/mol]: Arrhenius activation energy
surface_area_to_volume = 12000.0 # sigma [1/m]: surface-area-to-volume ratio (fine grass -> fast burn)
particle_density       = 500.0   # rho_p [kg/m^3]: solid material density (a_s = sigma/rho_p)
fuel_air_transfer_rate = 12.0    # k [W/(m^2*K)]: fuel<->air convective conductance
noise_scale            = 130.0  # spatial scale for Perlin noise: large -> grass varies in big patches/meadows rather than fine speckle
noise_floor            = 0.45   # remap the [0,1] noise to [floor,1] so low-noise meadow gaps keep ~half the loading instead of going bare (fills the barren-looking grassland)
spawn_density          = 1.0    # peak grass loading [kg/m^2] (scales the [0,1] noise)

# Shrub (chaparral/sagebrush-type woody scrub): a continuous fuel like grass, but woodier. Real
# shrubs carry fine, often resinous/waxy foliage on small woody stems, so they sit between grass and
# tree foliage: a SAV below grass (more woody stem, less fine surface) makes them ignite and burn a
# touch slower than grass, landing them at about the tree-canopy flammability the comment below
# describes, and well above the coarse, hard-to-light bole. Their volatile oils give a high heat
# content (real chaparral HHV ~19-21 MJ/kg, above both grass and clean wood).
[fuel_types.shrub]
specific_heat          = 2000.0  # SI specific heat [J/(kg*K)]: woody foliage, between dry grass (1800) and wood (2300)
ignition_threshold     = 573.0   # pyrolysis onset temperature [K] (~300 C): fine foliage lights readily, like grass
heat_of_combustion     = 1.9e7   # HHV [J/kg]: resinous/waxy extractives -> energetic, above grass (1.6e7) and wood (1.8e7)
stoich_oxygen          = 1.4     # s [kg O2 / kg fuel]: lignocellulosic, same as the other fuels
arrhenius_pre          = 8.0e7   # B [kg/(m^2*s)]: eager kinetics near the canopy's 1.0e8, above the bole's 5.0e7
activation_energy      = 1.0e5   # E_a [J/mol]: ignites readily, same gate as grass/canopy (not the bole's higher 1.1e5)
surface_area_to_volume = 4000.0  # sigma [1/m]: foliage + small woody stems -> below grass (12000) and just under the canopy (5000); a_s = 8
particle_density       = 500.0   # rho_p [kg/m^3]: solid material density (a_s = sigma/rho_p)
fuel_air_transfer_rate = 10.0    # k [W/(m^2*K)]: between the fine canopy (12) and the coarse bole (8)
noise_scale            = 110.0   # spatial scale for Perlin noise: large -> shrub forms big patches rather than fine speckle
noise_floor            = 0.35    # remap the [0,1] noise to [floor,1] so sparse shrub gaps keep a base loading rather than going bare
spawn_density          = 0.8     # peak shrub loading [kg/m^2] (scales the [0,1] noise)

# A tree is modelled as two co-located fuel types (Phase 6b): a light, high-SAV CANOPY (foliage,
# twigs, bark) that ignites readily from a passing front and carries the flame, and a heavy, low-SAV
# BOLE (trunk, big limbs) that holds most of the mass and burns slowly for minutes once the canopy
# heat lights it. Both spawn from the same per-cell tree count (gen_maps), so they always share a
# cell; the shared spatial params (noise_scale/max_trees_per_cell) are read from the first tree
# component (tree_canopy) and must match. The per-cell tree *density* is not a fuel param any more:
# it is set per biome in [biomes] (dense woodland, sparse grassland, slope-ramped shrubland), so trees
# carry no slope_preference/slope_falloff/spawn_density. fuel_per_tree splits the per-tree biomass
# between the two components (0.7 + 4.3 = 5.0 kg/m^2 per tree, same total as the old single tree type).

[fuel_types.tree_canopy]
specific_heat          = 2300.0  # SI specific heat [J/(kg*K)] (wood)
ignition_threshold     = 573.0   # pyrolysis onset temperature [K]: fine fuel lights readily
heat_of_combustion     = 1.8e7   # HHV [J/kg]
stoich_oxygen          = 1.4     # s [kg O2 / kg fuel]
arrhenius_pre          = 1.0e8   # B [kg/(m^2*s)]: eager kinetics, like grass
activation_energy      = 1.0e5   # E_a [J/mol]: low -> ignites readily
surface_area_to_volume = 5000.0  # sigma [1/m]: fine canopy fuel -> high surface -> fast ignite/burn (a_s = 10)
particle_density       = 500.0   # rho_p [kg/m^3]: solid material density (a_s = sigma/rho_p)
fuel_air_transfer_rate = 12.0    # k [W/(m^2*K)]: well-coupled fine fuel
noise_scale            = 150.0   # spatial scale for Perlin noise: large -> trees gather into big stands with wide gaps (tree spatial distribution; read from this first tree component)
fuel_per_tree          = 0.7     # fine-fuel loading per tree [kg/m^2] (4 trees -> 2.8 kg/m^2)
max_trees_per_cell     = 4       # hard cap on the per-cell tree count

[fuel_types.tree_bole]
specific_heat          = 2300.0  # SI specific heat [J/(kg*K)] (wood)
ignition_threshold     = 600.0   # pyrolysis onset temperature [K]
heat_of_combustion     = 1.8e7   # HHV [J/kg]
stoich_oxygen          = 1.4     # s [kg O2 / kg fuel]
arrhenius_pre          = 5.0e7   # B [kg/(m^2*s)]: surface kinetic-flux pre-exponential
activation_energy      = 1.1e5   # E_a [J/mol]: higher than the canopy -> ignites less readily
surface_area_to_volume = 500.0   # sigma [1/m]: coarse branch/limb wood (a_s=1). Tuned: below ~500 the bole never catches before the canopy burns out; above ~1000 its reactive surface re-hogs the ignition deposit and re-quenches the grass front. 500 -> bole lights and burns ~slowly (~1-2 min) over its heavy load
particle_density       = 500.0   # rho_p [kg/m^3]: solid material density (a_s = sigma/rho_p)
fuel_air_transfer_rate = 8.0     # k [W/(m^2*K)]
noise_scale            = 150.0   # must match tree_canopy (shared tree spatial distribution)
fuel_per_tree          = 4.3     # coarse-fuel loading per tree [kg/m^2] (4 trees -> 17.2 kg/m^2)
max_trees_per_cell     = 4

[radiant_heat]
# Flame radiant transfer: the fire-spread mechanism. The fuel's grey-body longwave
# eps*sigma*T^4 is emitted (and the emitter cooled) by [radiation]; this stage only
# *redistributes* the super-ambient part eps*sigma*(T^4 - temp_eq^4) onto nearby fuel by
# the inverse-square kernel, so a flame's heat ignites its neighbours. Uses [radiation].emissivity
# and the real Stefan-Boltzmann sigma; the T^4 sink (in [radiation]) self-limits flame temperature.
enabled             = true   # redistribute flame radiant heat to neighbours (off = convection-only spread)
kernel_radius_m     = 100.0  # radiative reach of a flame [m] (converted to cells by cell_size_m)
sky_escape_fraction = 0.2    # fraction of the redistributed emission lost upward to space (0..1)

[maps]
# Maps are fully-baked initial states loaded from disk. Generate them with
#     python src/gen_maps.py --count 8 --out maps
# reset() errors if no map is available, so generate at least one before running.
dir  = "maps"   # directory to load maps from
name = ""       # specific map filename to load; empty = pick a random map each reset

[rollout]
# Batched rollout collector (src/rollout.py) for world-model training. One Simulation
# steps num_envs worlds in parallel; each tick's B x C x N x N observation is pooled, and
# the trainer draws random near-I.I.D. minibatches from the pool.
#
# Consecutive ticks barely differ, so only every stride-th frame is stored, keeping the pool
# small and decorrelated.
#
# Pool memory = (steps // stride) * num_envs * C * N * N * bytes(buffer_dtype). With the
# defaults below at N=256, C=5: (4096//64) * 64 * 5 * 256*256 * 4 B ~= 5.4 GB per shard. The
# pool defaults to the CPU; shrink steps/num_envs, raise stride, or set buffer_dtype =
# "float16" (halves it) to fit your hardware; stepping always runs on the simulation device.
#
# Autoencoder pretraining (src/train_autoencoder.py): one "rollout" is a single env's 4096-step
# trajectory sampled every 64 steps (= 64 observations). Stepping num_envs=64 worlds in parallel
# for 16 rounds yields 16 * 64 * 64 = 65,536 observations (1024 rollouts) across 16 shards.
num_envs       = 64        # B: worlds stepped in parallel (sampled with replacement from the maps dir)
steps          = 4096      # ticks stepped per collect()
stride         = 64        # store every stride-th frame; pool holds (steps // stride) * num_envs samples
minibatch_size = 256       # samples per sample_minibatch() draw
buffer_device  = "cpu"     # where the sample pool lives ("cpu" or "cuda")
buffer_dtype   = "float32" # pool storage dtype ("float32" or "float16")

[autoencoder]
# Convolutional autoencoder pretraining (src/train_autoencoder.py). `arch` selects the encoder
# downsampling style; each style has its own subtable so it can be sized independently. Both
# styles share the same resize-conv (nearest-upsample + conv) decoder and differ only in the
# H/W-halving op: "pooled" uses a parameter-free 2x2 average pool, "strided" uses a learned 4x4
# stride-2 conv (kernel divisible by stride -> even coverage, no gridding). CLI flags on
# train_autoencoder.py (--arch/--channels/--latent-dim) override these.
#
# `channels` is the encoder width per downsample stage; the last entry is the conv channel
# count before flattening, and len(channels) sets how far H/W halve. On a 256x256 input the six
# defaults below produce a 256x4x4 feature map (flatten = 4096), which a dense layer projects
# to a `latent_dim` vector. grid_size must be divisible by 2**len(channels). At these settings
# "pooled" is ~10.8M params; "strided" adds ~3.5M (+32%) for the per-stage full 4x4 downsample
# convs, which mix across channels as well as downsample (see below).
arch = "pooled"

# `normalize_latent` L2-normalizes the latent to unit magnitude (projects it onto the unit
# hypersphere); the decoder's dense layer learns to rescale it. On by default.
[autoencoder.pooled]
channels         = [32, 64, 128, 256, 256, 256]  # encoder widths per downsample stage
latent_dim       = 512                           # dense latent vector width
normalize_latent = true                          # unit-magnitude latent (unit hypersphere)

[autoencoder.strided]
channels         = [32, 64, 128, 256, 256, 256]  # encoder widths per downsample stage
latent_dim       = 512                           # dense latent vector width
normalize_latent = true                          # unit-magnitude latent (unit hypersphere)

[action]
# Coarse action grid overlaid on the simulation grid: the map is divided into
# grid_size x grid_size action-cells, each spanning ([environment].grid_size /
# action.grid_size) sim cells per side. Hovering the mouse over an action-cell
# brightens it in the display so the current selection is visible. grid_size must
# divide [environment].grid_size evenly.
grid_size = 32   # action-grid cells per side (256 sim cells / 32 -> 8x8 cells each)

[environment]
# device selects where the simulation tensors live: "cuda" for an NVIDIA GPU,
# "cpu" to force the CPU. Omit (or leave commented) to auto-select cuda when
# available, else cpu — the same code path runs on both.
# device           = "cuda"
grid_size          = 256      # simulation grid cells (N x N)
window_size        = 512      # display window size in pixels (square)
max_steps          = 10_000   # episode length before truncation
print_episode_info = true     # print variable state at the start and end of each episode
